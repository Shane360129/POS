name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

jobs:
  frontend:
    name: 前端 build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: 後端 build + test（.NET 8，CI 內驗證）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # 模組化單體骨架（src/）：以 csproj 參考鏈建置 Host，再跑各模組與共用層測試。
      - run: dotnet restore src/Host/Host.csproj
      - run: dotnet build src/Host/Host.csproj -c Release --no-restore
      - run: dotnet test tests/BuildingBlocks.Tests/BuildingBlocks.Tests.csproj -c Release
      - run: dotnet test tests/Mdm.Tests/Mdm.Tests.csproj -c Release

  docker:
    name: Docker 映像建置（Host）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Host image
        run: docker build -f src/Host/Dockerfile -t invenflow-host:ci .
