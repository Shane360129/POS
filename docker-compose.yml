# 新模組化單體（src/）一鍵起：SQL Server + Host。
# 啟動：docker compose up -d --build  → http://localhost:8080/health、/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "InvenFlow#2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  host:
    build:
      context: .
      dockerfile: src/Host/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Database__Provider: "SqlServer"
      ConnectionStrings__Mdm: "Server=sqlserver,1433;Database=InvenFlow_Mdm;User Id=sa;Password=InvenFlow#2026;TrustServerCertificate=True"
      Cors__Origins__0: "http://localhost:5173"
    ports:
      - "8080:8080"
