services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invenflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "InvenFlow#2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'InvenFlow#2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./InvenFlow.Api
      dockerfile: Dockerfile
    container_name: invenflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InvenFlow;User Id=sa;Password=InvenFlow#2026;TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5080:8080"

volumes:
  sqldata:
